name: Formatwise gallery tests
on:
  workflow_dispatch:
    inputs:
      python-versions:
        description: 'List of Python versions to use in matrix, as JSON string. Defaults
          to all of them.'
        required: false
        type: string
      os-versions:
        description: 'List of OS versions to use in matrix, as JSON string. Defaults
          to all of them.'
        required: false
        type: string
      gallery-pages:
        description: 'Space separated gallery files to test. Defaults to empty, meaning
          every registered page.'
        required: false
        type: string
  workflow_call:
    inputs:
      python-versions:
        description: 'List of Python versions to use in matrix, as JSON string. Defaults
          to all of them.'
        required: false
        type: string
      os-versions:
        description: 'List of OS versions to use in matrix, as JSON string. Defaults
          to all of them.'
        required: false
        type: string
      gallery-pages:
        description: 'Space separated gallery files to test. Defaults to empty, meaning
          every registered page.'
        required: false
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      S3_GIN_BUCKET:
        required: true

jobs:
  load_python_and_os_versions:
    runs-on: ubuntu-latest
    outputs:
      ALL_PYTHON_VERSIONS: ${{ 
        steps.load_python_versions.outputs.python_versions }}
      ALL_OS_VERSIONS: ${{ steps.load_os_versions.outputs.os_versions }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 
            'workflow_run') && '86978c9c7013694b777e37d9a1ad2b32e7e14c3c' || 
            github.sha }}
      - id: load_python_versions
        run: |
          MINIMUM=$(cat ./.github/workflows/min_python_version.txt)
          MAXIMUM=$(cat ./.github/workflows/max_python_version.txt)
          echo "python_versions=[\"$MINIMUM\", \"$MAXIMUM\"]" >> "$GITHUB_OUTPUT"
      - id: load_os_versions
        run: |-
          echo "os_versions=$(cat ./.github/workflows/all_os_versions.txt)" >> "$GITHUB_OUTPUT"


    needs:
      - alpha_bridge_inputs
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  run:
    needs:
      - load_python_and_os_versions
      - alpha_bridge_inputs
    name: ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The caller may narrow the matrix, as `deploy-tests.yml` does for a draft pull request. The
        # daily passes nothing and gets every leg.
        python-version: ${{ fromJson(inputs.python-versions || 
          needs.load_python_and_os_versions.outputs.ALL_PYTHON_VERSIONS) }}
        os: ${{ fromJson(inputs.os-versions || 
          needs.load_python_and_os_versions.outputs.ALL_OS_VERSIONS) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 
            'workflow_run') && '86978c9c7013694b777e37d9a1ad2b32e7e14c3c' || 
            github.sha }}
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
          enable-cache: false

      - name: Prepare data for tests
        uses: ./.github/actions/load-data
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          s3-gin-bucket: ${{ secrets.S3_GIN_BUCKET }}

      # Discover formats dynamically from conversion gallery
      # This automatically finds all .rst files in docs/conversion_examples_gallery/
      # and creates format strings in the format "category:format_name"
      # `gallery-pages` is passed through the environment rather than interpolated into the script, so a
      # branch cannot smuggle shell into the run step by naming a file oddly.
      - name: Discover formats from gallery
        id: collect_gallery_formats
        shell: bash
        env:
          GALLERY_PAGES: ${{ inputs.gallery-pages }}
        run: |
          chmod +x .github/scripts/collect_gallery_formats.py
          FORMATS_JSON=$(python .github/scripts/collect_gallery_formats.py $GALLERY_PAGES)
          echo "formats_json=$FORMATS_JSON" >> $GITHUB_OUTPUT

          # Initialize Job Summary
          echo "# NeuroConv Format Testing Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** ${{ matrix.os }} | **Python:** ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FORMAT_COUNT=$(echo "$FORMATS_JSON" | jq length)
          echo "**Total Formats Discovered:** $FORMAT_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "Discovered $FORMAT_COUNT formats"
          echo "Formats: $FORMATS_JSON"

      # Run all format tests in sequence
      - name: Run all format tests in sequence
        shell: bash
        run: |
          # Get formats from discovery step and convert to bash array
          # Using while loop for macOS compatibility (readarray not available in older bash)
          FORMATS_JSON='${{ steps.collect_gallery_formats.outputs.formats_json }}'
          FORMATS=()
          while IFS= read -r format; do
            FORMATS+=("$format")
          done < <(echo "$FORMATS_JSON" | jq -r '.[]')

          echo "Testing ${#FORMATS[@]} formats:"
          printf '%s\n' "${FORMATS[@]}"
          echo ""

          # Initialize table in Job Summary
          echo "## Test Progress" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Format | Category | Status | Reason |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|--------|--------|" >> $GITHUB_STEP_SUMMARY

          # Track overall success
          OVERALL_SUCCESS=true
          FAILED_FORMATS=()

          # Loop through each format
          for format in "${FORMATS[@]}"; do
            # Split type, name and the installation extra, and trim any whitespace/carriage returns.
            # The extra is stated by the collection script rather than assumed to equal the page name.
            IFS=':' read -r type name extra <<< "$format"
            # Remove any trailing whitespace or carriage returns (Windows compatibility)
            type=$(echo "$type" | tr -d '\r\n' | xargs)
            name=$(echo "$name" | tr -d '\r\n' | xargs)
            extra=$(echo "$extra" | tr -d '\r\n' | xargs)

            echo "===================================================="
            echo "Testing $type:$name (installing neuroconv[$extra])"
            echo "===================================================="

            # Create fresh virtual environment with uv (much faster)
            uv venv clean_env_$name

            # Activate environment
            if [ "${{ runner.os }}" == "Windows" ]; then
              source clean_env_$name/Scripts/activate
            else
              source clean_env_$name/bin/activate
            fi

            # Install dependencies with uv (much faster than pip). An empty extra means the page converts
            # on a base install, which the gallery's extras_by_gallery_entry.json states explicitly.
            if [ -n "$extra" ]; then
              uv pip install --quiet ".[$extra]"
            else
              uv pip install --quiet "."
            fi
            uv pip install --group test

            # Check if the gallery file exists before running pytest
            gallery_file="docs/conversion_examples_gallery/$type/$name.rst"
            if [ ! -f "$gallery_file" ]; then
              echo "Gallery file not found: $gallery_file"
              OVERALL_SUCCESS=false
              FAILED_FORMATS+=("$type:$name (file not found)")
              # Update Job Summary
              echo "| $name | $type | Failed | File not found |" >> $GITHUB_STEP_SUMMARY
            else
              # Run test
              if pytest --numprocesses=0 --doctest-glob="*.rst" "$gallery_file"; then
                echo "$type:$name test passed"
                # Update Job Summary
                echo "| $name | $type | Passed | All doctests successful |" >> $GITHUB_STEP_SUMMARY
              else
                echo "$type:$name test failed"
                OVERALL_SUCCESS=false
                FAILED_FORMATS+=("$type:$name")
                # Update Job Summary
                echo "| $name | $type | Failed | Doctest failures |" >> $GITHUB_STEP_SUMMARY
              fi
            fi

            # Deactivate environment
            deactivate

            # Remove environment to save space
            rm -rf clean_env_$name

            echo ""
          done

          # Count results for summary
          TOTAL_FORMATS=${#FORMATS[@]}
          FAILED_COUNT=${#FAILED_FORMATS[@]}
          PASSED_COUNT=$((TOTAL_FORMATS - FAILED_COUNT))

          # Add final summary to Job Summary
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Final Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Formats Tested:** $TOTAL_FORMATS" >> $GITHUB_STEP_SUMMARY
          echo "- **Passed:** $PASSED_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed:** $FAILED_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$OVERALL_SUCCESS" = true ]; then
            echo "**All format tests passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Some format tests failed:**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Failed Formats:" >> $GITHUB_STEP_SUMMARY
            for failed in "${FAILED_FORMATS[@]}"; do
              echo "- $failed" >> $GITHUB_STEP_SUMMARY
            done
          fi

          # Report results to console
          echo "===================================================="
          if [ "$OVERALL_SUCCESS" = true ]; then
            echo "All format tests passed!"
          else
            echo "Some format tests failed:"
            for failed in "${FAILED_FORMATS[@]}"; do
              echo "   - $failed"
            done
            exit 1
          fi
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  alpha_bridge_inputs:
    name: CI input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-${{ github.workflow }}-${{ github.sha }}-${{ 
        github.event.schedule || github.event_name }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
      - id: identity
        name: Check source, workflow, variables, and runner inputs
        env:
          GH_TOKEN: ${{ github.token }}
          AB_REPOSITORY: ${{ github.repository }}
          AB_RUN_ID: ${{ github.run_id }}
          AB_HEAD_SHA: ${{ (github.event_name == 'schedule' || github.event_name
            == 'workflow_run') && '86978c9c7013694b777e37d9a1ad2b32e7e14c3c' || 
            github.sha }}
          AB_REF: ${{ (github.event_name == 'schedule' || github.event_name == 
            'workflow_run') && 'refs/heads/main' || github.ref }}
          AB_WORKFLOW_DIGEST: 
            7dc36212c9c86f2c20b2b72cecba6c6ddbeb25abdc22783f6a3b73c59fff3005
          AB_EVENT: ${{ github.event_name }}
          AB_SCHEDULE: ${{ github.event.schedule || '' }}
          AB_VARIABLES: ${{ toJSON(vars) }}
          AB_INPUTS: ${{ toJSON(inputs) }}
          AB_DEFAULT_PERMISSIONS: read
          AB_WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
        shell: bash
        run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native automatic-CI input check,
          embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
          annotations\n\nimport base64\nimport hashlib\nimport json\nimport os\nimport
          re\nimport urllib.parse\nimport urllib.request\n\nINPUT_CHECK_NAMES = (\"\
          CI input check\", \"AlphaBridge input check\")\nINPUT_IDENTITY_PREFIXES
          = (\"CI input identity \", \"AlphaBridge input identity \")\n\n\ndef is_input_check(job):\n\
          \    \"\"\"GitHub prefixes callable job names with each caller's display
          name.\"\"\"\n    return job.get(\"name\", \"\").rsplit(\" / \", 1)[-1] in
          INPUT_CHECK_NAMES\n\n\ndef input_identity(job):\n    for step in job.get(\"\
          steps\", []):\n        if step.get(\"conclusion\") != \"success\":\n   \
          \         continue\n        name = step.get(\"name\", \"\")\n        for
          prefix in INPUT_IDENTITY_PREFIXES:\n            if name.startswith(prefix):\n\
          \                identity = name.removeprefix(prefix)\n                if
          re.fullmatch(r\"[0-9a-f]{64}\", identity):\n                    return identity\n\
          \    return \"\"\n\n\ndef parent_has_work(get, repository, parent):\n  \
          \  if (\n        not parent\n        or parent.get(\"head_branch\") != \"\
          alpha-bridge-ci\"\n        or parent.get(\"status\") != \"completed\"\n\
          \    ):\n        return True\n    sha = parent[\"head_sha\"]\n    if re.fullmatch(r\"\
          [0-9a-f]{40}\", sha) is None:\n        raise ValueError(\"parent workflow
          has no exact configuration commit\")\n    record = get(f\"/repos/{repository}\"\
          )\n    marker_file = get(f\"/repos/{repository}/contents/.github/alpha-bridge-ci.json?ref={sha}\"\
          )\n    marker = json.loads(base64.b64decode(marker_file[\"content\"]))\n\
          \    if (\n        record.get(\"fork\") is not True\n        or marker.get(\"\
          schema\") != \"alpha-bridge/fork-ci\"\n        or marker.get(\"source_repository\"\
          ) != record.get(\"parent\", {}).get(\"full_name\")\n    ):\n        raise
          ValueError(\"parent CI configuration has no verified fork ownership\")\n\
          \    path = parent[\"path\"].split(\"@\", 1)[0]\n    if not path.startswith(\"\
          .github/workflows/\") or \"/\" in path.removeprefix(\".github/workflows/\"\
          ):\n        raise ValueError(\"parent workflow path is outside its configuration
          owner\")\n    definition = get(f\"/repos/{repository}/contents/{urllib.parse.quote(path,
          safe='/')}?ref={sha}\")\n    if hashlib.sha256(base64.b64decode(definition[\"\
          content\"])).hexdigest() != marker.get(\n        \"definition_sha256\",
          {}\n    ).get(path):\n        raise ValueError(\"parent workflow differs
          from its owned definition\")\n    if path == \".github/workflows/alpha-bridge-ci-verify.yml\"\
          :\n        return False\n    jobs = []\n    page = 1\n    while True:\n\
          \        values = get(\n            f\"/repos/{repository}/actions/runs/{parent['id']}/jobs?per_page=100&page={page}\"\
          \n        )[\"jobs\"]\n        jobs.extend(values)\n        if len(values)
          < 100:\n            break\n        page += 1\n    guards = [\n        job\n\
          \        for job in jobs\n        if is_input_check(job) and job.get(\"\
          conclusion\") == \"success\" and input_identity(job)\n    ]\n    return
          not guards or any(\n        job not in guards and job.get(\"conclusion\"\
          ) != \"skipped\" for job in jobs\n    )\n\n\ndef changed(get, *, repository,
          run_id, identity, job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
          )\n    event = current[\"event\"]\n    page = 1\n    while True:\n     \
          \   # Filter locally: GitHub caps filtered searches at 1,000 results.\n\
          \        query = urllib.parse.urlencode({\"per_page\": 100, \"page\": page})\n\
          \        runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
          )\n        for run in runs[\"workflow_runs\"]:\n            if run[\"id\"\
          ] == run_id:\n                continue\n            if run.get(\"head_branch\"\
          ) != current[\"head_branch\"] or run.get(\"event\") != event:\n        \
          \        continue\n            job_page = 1\n            while True:\n \
          \               jobs = get(\n                    f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={job_page}\"\
          \n                )[\"jobs\"]\n                for job in jobs:\n      \
          \              if (\n                        (\n                       \
          \     is_input_check(job)\n                            if job_name in INPUT_CHECK_NAMES\n\
          \                            else job[\"name\"] == job_name\n          \
          \              )\n                        and job.get(\"status\") == \"\
          completed\"\n                        and job.get(\"conclusion\") == \"success\"\
          \n                        and input_identity(job) == identity\n        \
          \            ):\n                        return False\n                if
          len(jobs) < 100:\n                    break\n                job_page +=
          1\n        if len(runs[\"workflow_runs\"]) < 100:\n            return True\n\
          \        page += 1\n\n\ndef main():\n    event = os.environ[\"AB_EVENT\"\
          ]\n    event_payload = None\n    if event not in {\"schedule\", \"workflow_run\"\
          }:\n        with open(os.environ[\"GITHUB_EVENT_PATH\"], encoding=\"utf-8\"\
          ) as payload_file:\n            event_payload = json.load(payload_file)\n\
          \    inputs = {\n        \"source_commit\": os.environ[\"AB_HEAD_SHA\"],\n\
          \        \"source_ref\": os.environ[\"AB_REF\"],\n        \"workflow_definition\"\
          : os.environ[\"AB_WORKFLOW_DIGEST\"],\n        \"event\": event,\n     \
          \   \"event_payload\": event_payload,\n        \"schedule\": os.environ[\"\
          AB_SCHEDULE\"],\n        \"variables\": json.loads(os.environ[\"AB_VARIABLES\"\
          ]),\n        \"inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n      \
          \  \"default_workflow_permissions\": os.environ[\"AB_DEFAULT_PERMISSIONS\"\
          ],\n        \"runner_image\": [os.environ.get(\"ImageOS\", \"\"), os.environ.get(\"\
          ImageVersion\", \"\")],\n        \"producer\": json.loads(os.environ.get(\"\
          AB_WORKFLOW_RUN\", \"null\")),\n    }\n    identity = hashlib.sha256(json.dumps(inputs,
          sort_keys=True).encode()).hexdigest()\n\n    def get(path):\n        request
          = urllib.request.Request(\n            \"https://api.github.com\" + path,\n\
          \            headers={\n                \"Authorization\": \"Bearer \" +
          os.environ[\"GH_TOKEN\"],\n                \"Accept\": \"application/vnd.github+json\"\
          ,\n                \"X-GitHub-Api-Version\": \"2026-03-10\",\n         \
          \   },\n        )\n        with urllib.request.urlopen(request, timeout=60)
          as response:\n            return json.load(response)\n\n    manual = event
          == \"workflow_dispatch\" or int(os.environ[\"GITHUB_RUN_ATTEMPT\"]) > 1\n\
          \    should_run = manual or (\n        (\n            inputs[\"event\"]
          != \"workflow_run\"\n            or parent_has_work(get, os.environ[\"AB_REPOSITORY\"\
          ], inputs[\"producer\"])\n        )\n        and changed(\n            get,\n\
          \            repository=os.environ[\"AB_REPOSITORY\"],\n            run_id=int(os.environ[\"\
          AB_RUN_ID\"]),\n            identity=identity,\n            job_name=\"\
          CI input check\",\n        )\n    )\n    with open(os.environ[\"GITHUB_OUTPUT\"\
          ], \"a\", encoding=\"utf-8\") as output:\n        output.write(f\"digest={identity}\\\
          nchanged={str(should_run).lower()}\\n\")\n    print(\n        \"Explicit
          CI run requested\"\n        if manual\n        else \"CI inputs changed\"\
          \n        if should_run\n        else \"CI inputs unchanged; build and test
          jobs skipped\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n\n\
          ALPHA_BRIDGE_CI_PY\n"
      - name: CI input identity ${{ steps.identity.outputs.digest }}
        run: echo 'Input identity recorded'
